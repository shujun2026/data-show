<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据展示页</title>
    <style>
        body{max-width:900px;margin:30px auto;padding:0 20px;font-family:Arial;background:#f5f7fa}
        .box{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px #00000015}
        h1{text-align:center;color:#222;font-size:26px;margin-top:0}
        .item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eee;font-size:18px}
        .name{color:#444}
        .val{font-weight:bold;color:#007bff}
        .tip{margin-top:20px;color:#777;font-size:15px;text-align:center}
    </style>
</head>
<body>
    <div class="box">
        <h1>每日数据</h1>
        <div class="item"><span class="name">项目1</span><span class="val">100</span></div>
        <div class="item"><span class="name">项目2</span><span class="val">230</span></div>
        <div class="item"><span class="val">项目3</span><span class="val">86</span></div>
        <div class="item"><span class="name">项目4</span><span class="val">520</span></div>
        <div class="item"><span class="name">项目5</span><span class="val">315</span></div>
        <div class="tip">这里可以随时修改数字和文字</div>
    </div>
</body>
</html>
